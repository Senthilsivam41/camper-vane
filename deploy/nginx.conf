# Same-origin nginx reverse proxy for Camper Vane.
# Place UI build (frontend/dist) under /var/www/camper-vane.
# Go API listens on 127.0.0.1:8080.

server {
    listen 443 ssl http2;
    server_name camper.example.com;

    # ssl_certificate     /etc/ssl/certs/camper.pem;
    # ssl_certificate_key /etc/ssl/private/camper.key;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: disable buffering and keep the upstream connection open.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location / {
        root /var/www/camper-vane;
        try_files $uri /index.html;
    }
}
